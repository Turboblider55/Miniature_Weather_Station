<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Weather Station</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>Weather Station</h1>

    <div id="stationBox"></div>

    <h2>Aktuális mérés</h2>
    <div id="latestMeasurement"></div>

     <h2>Grafikon</h2>
    <div class="chart-controls">
        <label for="chartMode">Grafikon adatai:</label>

        <select id="chartMode">
            <option value="latest30">Elmúlt 30 mérés</option>
        </select>
    </div>


    <div class="chart-layout">
    <div class="chart-card">
        <canvas id="weatherChart"></canvas>
    </div>

     
    <div class="chart-checkboxes">
        <h3>Adatok</h3>

        <label><input type="checkbox" id="chartTemperature" checked> Hőmérséklet</label>
        <label><input type="checkbox" id="chartHumidity" checked> Páratartalom</label>
        <label><input type="checkbox" id="chartPressure"> Nyomás</label>
        <label><input type="checkbox" id="chartAqi"> AQI</label>
        <label><input type="checkbox" id="chartTvoc"> TVOC</label>
        <label><input type="checkbox" id="chartEco2"> eCO2</label>
        <label><input type="checkbox" id="chartLux"> Fény</label>
        <label><input type="checkbox" id="chartCloud"> Felhő index</label>
        <label><input type="checkbox" id="chartAltitude"> Magasság</label>
    </div>
</div>

  



    <h2>Legutóbbi mérések</h2>
    <div id="measurements"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
